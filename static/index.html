<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentinel AI | Threat Intelligence</title>
  
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  
  <!-- Modern Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.7);
      --border: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --accent: #38bdf8;
      --glow: 0 0 20px rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --warning: #f59e0b;
      --safe: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      padding-top: 1rem;
    }
    .header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-shadow: var(--glow);
    }
    .header p {
      margin: 0;
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(0,0,0,0.3);
      padding: 0.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab.active {
      background: var(--accent);
      color: #0f172a;
      box-shadow: var(--glow);
    }

    /* Glass Panels */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: none;
      animation: fadeIn 0.4s ease-out forwards;
    }
    .panel.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Elements */
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    select, textarea {
      width: 100%;
      background: rgba(0,0,0,0.4);
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      transition: border 0.3s ease;
    }
    textarea#codeInput { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
    textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: inset 0 0 10px rgba(56,189,248,0.2);
    }

    button.scan-btn {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button.scan-btn:active { transform: scale(0.98); }
    button.scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Animated Loader */
    #loader {
      display: none;
      text-align: center;
      padding: 3rem 0;
    }
    .radar {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      margin: 0 auto 1rem auto;
      position: relative;
      overflow: hidden;
      box-shadow: var(--glow);
    }
    .radar::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 50%; height: 50%;
      background: linear-gradient(45deg, transparent 50%, rgba(56,189,248,0.8) 100%);
      transform-origin: 0 0;
      animation: scan 1.5s linear infinite;
    }
    @keyframes scan { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Threat Report (Results) */
    #resultPanel {
      margin-top: 1.5rem;
      border-left: 4px solid var(--accent);
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      color: #fff;
    }
    .badge-Low { background: var(--safe); box-shadow: 0 0 15px var(--safe); }
    .badge-Medium { background: var(--warning); box-shadow: 0 0 15px var(--warning); }
    .badge-High { background: var(--danger); box-shadow: 0 0 15px var(--danger); }

    .report-section { margin-bottom: 1.5rem; }
    .report-section h3 {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .tag {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .screenshot {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>SENTINEL</h1>
    <p>AI Threat Intelligence</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('messageTab', this)">Phishing & URLs</button>
    <button class="tab" onclick="switchTab('codeTab', this)">Source Code</button>
  </div>

  <!-- MSG / URL SCANNER -->
  <div id="messageTab" class="panel active">
    <label>Communication Channel</label>
    <select id="channel">
      <option value="sms">SMS / iMessage</option>
      <option value="whatsapp">WhatsApp / Telegram</option>
      <option value="email">Email</option>
      <option value="social">Social Media</option>
    </select>
    
    <label>Payload (Text, URL, or UPI)</label>
    <textarea id="msgInput" rows="4" placeholder="Paste the suspicious link or message here..."></textarea>
    
    <button class="scan-btn" onclick="triggerScan('message')">Initiate Scan</button>
  </div>

  <!-- CODE SCANNER -->
  <div id="codeTab" class="panel">
    <label>Source Code Snippet</label>
    <textarea id="codeInput" rows="6" placeholder="Paste backend script, JS, or config file..."></textarea>
    
    <button class="scan-btn" onclick="triggerScan('code')">Analyze Logic</button>
  </div>

  <!-- SCANNING ANIMATION -->
  <div id="loader">
    <div class="radar"></div>
    <p style="color: var(--accent); font-weight: 600; letter-spacing: 1px;">ISOLATING SANDBOX & ANALYZING...</p>
  </div>

  <!-- RESULTS PANEL -->
  <div id="resultPanel" class="panel"></div>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
      document.getElementById('resultPanel').style.display = 'none';
    }

    async function triggerScan(type) {
      const loader = document.getElementById('loader');
      const resultPanel = document.getElementById('resultPanel');
      const inputs = document.querySelectorAll('button, textarea, select');
      
      inputs.forEach(i => i.disabled = true);
      resultPanel.style.display = 'none';
      loader.style.display = 'block';

      const endpoint = type === 'message' ? '/scan/message' : '/scan/code';
      const payload = type === 'message'
        ? { text: document.getElementById('msgInput').value, channel: document.getElementById('channel').value }
        : { code: document.getElementById('codeInput').value };

      try {
        const scanRes = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const evidence = await scanRes.json();

        const aiRes = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ evidence, type })
        });
        const analysis = await aiRes.json();

        const risk = analysis.risk_level || 'High';
        let html = `<div class="badge badge-${risk}">${risk} RISK DETECTED</div>`;

        // Render extracted flags/findings as hacker-style tags
        const allFlags = [...(evidence.flags || []), ...(evidence.findings || [])];
        if (allFlags.length > 0) {
          html += `<div class="report-section">
            <h3>Heuristics Triggered</h3>
            <div class="tags">${allFlags.map(f => `<span class="tag">${f}</span>`).join('')}</div>
          </div>`;
        }

        html += `<div class="report-section">
          <h3>AI Analysis</h3>
          <p>${analysis.explanation}</p>
        </div>`;

        html += `<div class="report-section">
          <h3>Remediation Action</h3>
          <p style="color: var(--accent); font-weight:600;">${analysis.fix}</p>
        </div>`;

        if (type === 'message' && evidence.url_analysis && evidence.url_analysis[0]?.screenshot_base64) {
          html += `<div class="report-section">
            <h3>Sandboxed Preview</h3>
            <img class="screenshot" src="data:image/png;base64,${evidence.url_analysis[0].screenshot_base64}" />
          </div>`;
        }

        resultPanel.innerHTML = html;
        resultPanel.style.display = 'block';
        
        // Scroll to results smoothly
        resultPanel.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        resultPanel.innerHTML = `<p style="color: var(--danger);"><strong>System Error:</strong> ${err.message}</p>`;
        resultPanel.style.display = 'block';
      } finally {
        inputs.forEach(i => i.disabled = false);
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
